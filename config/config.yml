containers:
  - name: service-a
    startupProbe:
      httpGet:
        path: /startup
        port: 8080
        host: localhost
      initialDelaySeconds: 0
      periodSeconds: 2
      failureThreshold: 30
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8080
        host: localhost
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 1
    readinessProbe:
      httpGet:
        path: /ready
        port: 8080
        host: localhost
      initialDelaySeconds: 2
      periodSeconds: 5
      failureThreshold: 3

  - name: service-b
    livenessProbe:
      httpGet:  
        path: /healthz
        port: 9090
        host: localhost
      initialDelaySeconds: 5
      periodSeconds: 15
      failureThreshold: 1
    readinessProbe:
      httpGet:
        path: /ready
        port: 9090
        host: localhost
      initialDelaySeconds: 2
      periodSeconds: 5
      failureThreshold: 2

  - name: service-c
    livenessProbe:
      httpGet:
        path: /healthz
        port: 9091
        host: localhost
      periodSeconds: 20
      failureThreshold: 3

  - name: service-grpc
    startupProbe:
      grpc:
        port: 50051
        service: startup
        host: localhost
      initialDelaySeconds: 0
      periodSeconds: 2
      failureThreshold: 30
    livenessProbe:
      grpc:
        port: 50051
        service: liveness
        host: localhost 
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 1
    readinessProbe:
      grpc:
        port: 50051
        service: readiness
        host: localhost
      initialDelaySeconds: 2
      periodSeconds: 5
      failureThreshold: 3

  - name: service-grpc2
    livenessProbe:
      grpc:
        port: 50052
        service: liveness
        host: localhost 
      initialDelaySeconds: 5
      periodSeconds: 15
      failureThreshold: 1
    readinessProbe:
      grpc:
        port: 50052
        service: readiness
        host: localhost
      initialDelaySeconds: 2
      periodSeconds: 5
      failureThreshold: 3

  - name: service-tcp
    livenessProbe:
      tcpSocket:
        port: 9092
        host: localhost 
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 1