containers:
  - name: service-a
    startupProbe:
      httpGet:
        path: /startup
        port: 8080          
        host: service-a        
      initialDelaySeconds: 0
      periodSeconds: 2
      failureThreshold: 30
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8080
        host: service-a      
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /ready
        port: 8080
        host: service-a       
      initialDelaySeconds: 2
      periodSeconds: 5
      failureThreshold: 3

  - name: service-b
    livenessProbe:
      httpGet:  
        path: /healthz
        port: 8080          
        host: service-b        
      initialDelaySeconds: 5
      periodSeconds: 15
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /ready
        port: 8080             
        host: service-b         
      initialDelaySeconds: 2
      periodSeconds: 5
      failureThreshold: 2

  - name: service-c
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8080          
        host: service-c       
      periodSeconds: 20
      failureThreshold: 3

  - name: service-grpc
    startupProbe:
      grpc:
        port: 50051
        service: startup
        host: service-grpc     
      initialDelaySeconds: 0
      periodSeconds: 2
      failureThreshold: 5
    livenessProbe:
      grpc:
        port: 50051
        service: liveness
        host: service-grpc      
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 1
    readinessProbe:
      grpc:
        port: 50051
        service: readiness
        host: service-grpc     
      initialDelaySeconds: 2
      periodSeconds: 5
      failureThreshold: 3

  - name: service-grpc2
    livenessProbe:
      grpc:
        port: 50052            
        service: liveness
        host: service-grpc2     
      initialDelaySeconds: 5
      periodSeconds: 15
      failureThreshold: 1
    readinessProbe:
      grpc:
        port: 50052
        service: readiness
        host: service-grpc2     
      initialDelaySeconds: 2
      periodSeconds: 5
      failureThreshold: 3

  - name: service-tcp
    livenessProbe:
      tcpSocket:
        port: 9009             
        host: service-tcp       
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 1