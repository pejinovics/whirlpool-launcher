version: "3.8"

services:
  whirlpool-launcher:
    build:
      context: .
      dockerfile: Dockerfile
    image: whirlpool-launcher:latest
    container_name: whirlpool-launcher
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro
    environment:
      - CONFIG_PATH=/app/config/config.yml
    restart: unless-stopped
